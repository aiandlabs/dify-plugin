version: 0.0.2
type: plugin
author: aiand
name: aiand
label:
  en_US: ai&
  ja_JP: ai&
description:
  en_US: "Japan-hosted open models with zero data retention: Gemma, gpt-oss and many more. OpenAI-compatible, with tool calling, image and video input, and reasoning control."
  ja_JP: 日本国内でホストされるオープンモデルAPIを、データ保持無しで提供。Gemma・gpt-oss をはじめ、多数のモデルに対応。OpenAI 互換で、ツール呼び出し、画像・動画入力、推論レベルの調整が可能です。
icon: icon.svg
icon_dark: icon-dark.svg
resource:
  memory: 268435456
  permission:
    model:
      enabled: true
      llm: true
      text_embedding: false
      rerank: false
      tts: false
      speech2text: false
      moderation: false
plugins:
  models:
    - provider/aiand.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: 1.0.0
created_at: 2026-10-20T00:00:00Z
privacy: PRIVACY.md
repo: https://github.com/aiandlabs/dify-plugin
contact: support@aiand.com
network:
  domains:
    - api.aiand.com
