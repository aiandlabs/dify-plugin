name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check model schemas
        run: |
          pip install -q -r requirements.txt pyyaml
          python scripts/check_models.py

      - name: Package with the Dify CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.6.11 -R langgenius/dify-plugin-daemon -p dify-plugin-linux-amd64 -O "$RUNNER_TEMP/dify"
          chmod +x "$RUNNER_TEMP/dify"
          "$RUNNER_TEMP/dify" plugin package . -o "$RUNNER_TEMP/aiand.difypkg"

      - name: Marketplace validator
        run: |
          git clone -q --depth 1 https://github.com/langgenius/dify-marketplace-toolkit.git "$RUNNER_TEMP/toolkit"
          cd "$RUNNER_TEMP/toolkit"
          python validator/validate-difypkg.py "$RUNNER_TEMP/aiand.difypkg" --output-dir "$RUNNER_TEMP/report"
